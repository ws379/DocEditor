<h2>工具栏风格</h2>
<p class="subtitle">顶部工具栏应该是什么风格？</p>

<div class="cards">
  <div class="card" data-choice="single-row" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 16px; background: #f8fafc;">
      <div style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
        <div style="height: 44px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 12px; gap: 6px;">
          <div style="width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px;"></div>
          <div style="width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px;"></div>
          <div style="width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px;"></div>
          <div style="width: 1px; height: 24px; background: #e2e8f0; margin: 0 4px;"></div>
          <div style="width: 60px; height: 24px; background: #f1f5f9; border-radius: 4px; border: 1px solid #e2e8f0;"></div>
          <div style="width: 40px; height: 24px; background: #f1f5f9; border-radius: 4px; border: 1px solid #e2e8f0;"></div>
          <div style="width: 1px; height: 24px; background: #e2e8f0; margin: 0 4px;"></div>
          <div style="width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px;"></div>
          <div style="width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px;"></div>
          <div style="width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px;"></div>
          <div style="flex: 1;"></div>
          <div style="width: 70px; height: 28px; background: #3b82f6; border-radius: 4px;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 单行紧凑工具栏</h3>
      <p>所有按钮在一行，用分隔线分组。简洁高效，屏幕空间利用率最高。</p>
    </div>
  </div>

  <div class="card" data-choice="ribbon" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 16px; background: #f8fafc;">
      <div style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
        <div style="height: 32px; background: #f8fafc; display: flex; align-items: flex-end; padding: 0 8px; gap: 2px;">
          <div style="padding: 4px 12px; background: #fff; border-radius: 6px 6px 0 0; border: 1px solid #e2e8f0; border-bottom: none; font-size: 11px; color: #3b82f6; font-weight: 600;">开始</div>
          <div style="padding: 4px 12px; font-size: 11px; color: #64748b;">插入</div>
          <div style="padding: 4px 12px; font-size: 11px; color: #64748b;">页面布局</div>
          <div style="padding: 4px 12px; font-size: 11px; color: #64748b;">引用</div>
        </div>
        <div style="height: 72px; background: #fff; border-top: 1px solid #e2e8f0; padding: 8px 12px; display: flex; gap: 16px;">
          <div style="display: flex; flex-direction: column; gap: 4px; padding-right: 12px; border-right: 1px solid #e2e8f0;">
            <div style="display: flex; gap: 4px;"><div style="width: 28px; height: 28px; background: #fef2f2; border-radius: 4px;"></div></div>
            <div style="font-size: 9px; color: #94a3b8; text-align: center;">剪贴板</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px; padding-right: 12px; border-right: 1px solid #e2e8f0;">
            <div style="display: flex; gap: 4px;">
              <div style="width: 80px; height: 22px; background: #f1f5f9; border-radius: 3px; border: 1px solid #e2e8f0;"></div>
              <div style="width: 36px; height: 22px; background: #f1f5f9; border-radius: 3px; border: 1px solid #e2e8f0;"></div>
            </div>
            <div style="display: flex; gap: 2px;">
              <div style="width: 20px; height: 20px; background: #f1f5f9; border-radius: 3px;"></div>
              <div style="width: 20px; height: 20px; background: #dbeafe; border-radius: 3px;"></div>
              <div style="width: 20px; height: 20px; background: #f1f5f9; border-radius: 3px;"></div>
            </div>
            <div style="font-size: 9px; color: #94a3b8; text-align: center;">字体</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px; padding-right: 12px; border-right: 1px solid #e2e8f0;">
            <div style="display: flex; gap: 2px;">
              <div style="width: 20px; height: 20px; background: #f1f5f9; border-radius: 3px;"></div>
              <div style="width: 20px; height: 20px; background: #dbeafe; border-radius: 3px;"></div>
            </div>
            <div style="font-size: 9px; color: #94a3b8; text-align: center;">段落</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; gap: 4px;">
              <div style="width: 60px; height: 22px; background: #dbeafe; border-radius: 3px; border: 1px solid #93c5fd; font-size: 9px; padding: 2px; color: #1e40af;">标题 1</div>
              <div style="width: 60px; height: 22px; background: #f1f5f9; border-radius: 3px; border: 1px solid #e2e8f0; font-size: 9px; padding: 2px; color: #64748b;">标题 2</div>
            </div>
            <div style="font-size: 9px; color: #94a3b8; text-align: center;">样式</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. Ribbon 分组标签页</h3>
      <p>类似 WPS/Word 的 Ribbon 界面，功能按标签页分组（开始/插入/布局）。功能最丰富。</p>
    </div>
  </div>
</div>
